services:
  edgeever:
    # Build and start the checked-out fork: docker compose up -d --build
    build:
      context: .
      dockerfile: Dockerfile
    image: edgeever-local:latest
    pull_policy: build
    container_name: edgeever
    restart: unless-stopped
    env_file:
      # Local credentials; excluded from Git and the Docker build context.
      - .env.stack
    init: true
    environment:
      TZ: Europe/Berlin
      EDGE_EVER_CONTAINER_IMAGE: edgeever-local
    volumes:
      - /home/nico/volumes/edgeever:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.edgeever-router.rule=Host(`edgeever.nico-nostheide.de`)
      - traefik.http.routers.edgeever-router.tls=true
      - traefik.http.routers.edgeever-router.entrypoints=websecure
      - traefik.http.routers.edgeever-router.tls.certresolver=myresolver
      - traefik.http.routers.edgeever-router.service=edgeever-srv
      - traefik.http.services.edgeever-srv.loadbalancer.server.port=8787
      - traefik.http.services.edgeever-srv.loadbalancer.server.scheme=http
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - proxy

networks:
  proxy:
    external: true
